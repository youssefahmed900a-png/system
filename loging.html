<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شركة إن جي إم للتسطيبات المعمارية</title>
    <link rel="stylesheet" href="loging.css">

            <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <!-- داخل ملف login.html -->


<script type="module" src="login.js"></script>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">دخول</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
